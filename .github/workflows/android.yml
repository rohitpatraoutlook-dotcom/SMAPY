name: SMAPY Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=smapy \
            --org=com.smapy \
            build_project

          cp pubspec.yaml build_project/pubspec.yaml
          rm -rf build_project/lib
          cp -r lib build_project/lib
          rm -rf build_project/test

      - name: Configure native Android runtime bridge
        working-directory: build_project
        run: |
          cat > android/app/src/main/kotlin/com/smapy/smapy/MainActivity.kt <<'KOTLIN'
          package com.smapy.smapy

          import android.os.Build
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "com.smapy/runtime"

              override fun configureFlutterEngine(
                  flutterEngine: FlutterEngine
              ) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      channelName
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "getDeviceInfo" -> {
                              result.success(
                                  mapOf(
                                      "platform" to "Android",
                                      "androidVersion" to Build.VERSION.RELEASE,
                                      "sdkInt" to Build.VERSION.SDK_INT,
                                      "supportedAbis" to Build.SUPPORTED_ABIS.toList()
                                  )
                              )
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }
          KOTLIN

      - name: Resolve dependencies
        working-directory: build_project
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: build_project
        run: flutter analyze

      - name: Build release APK
        working-directory: build_project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smapy-android-apk
          path: build_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
