name: SMAPY Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=smapy \
            --org=com.smapy \
            build_project

          cp pubspec.yaml build_project/pubspec.yaml
          rm -rf build_project/lib
          cp -r lib build_project/lib
          rm -rf build_project/test

      - name: Configure Android runtime service
        working-directory: build_project
        run: |
          cat > android/app/src/main/kotlin/com/smapy/smapy/MainActivity.kt <<'KOTLIN'
          package com.smapy.smapy

          import android.os.Build
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity : FlutterActivity() {
              private val channelName = "com.smapy/runtime"

              private fun runtimeDirectories(): Map<String, File> {
                  val base = File(filesDir, "smapy-runtime")
                  return mapOf(
                      "base" to base,
                      "rootfs" to File(base, "rootfs"),
                      "bin" to File(base, "bin"),
                      "downloads" to File(base, "downloads"),
                      "tmp" to File(base, "tmp"),
                      "home" to File(base, "home")
                  )
              }

              private fun prepareRuntimeStorage(): Map<String, Any> {
                  val directories = runtimeDirectories()

                  directories.values.forEach { directory ->
                      if (!directory.exists() && !directory.mkdirs()) {
                          throw IllegalStateException(
                              "Could not create runtime directory: ${directory.name}"
                          )
                      }
                  }

                  return mapOf(
                      "prepared" to true,
                      "storage" to "app-private",
                      "directories" to directories.mapValues {
                          it.value.absolutePath
                      }
                  )
              }

              override fun configureFlutterEngine(
                  flutterEngine: FlutterEngine
              ) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      channelName
                  ).setMethodCallHandler { call, result ->
                      try {
                          when (call.method) {
                              "getDeviceInfo" -> {
                                  result.success(
                                      mapOf(
                                          "platform" to "Android",
                                          "androidVersion" to Build.VERSION.RELEASE,
                                          "sdkInt" to Build.VERSION.SDK_INT,
                                          "supportedAbis" to Build.SUPPORTED_ABIS.toList(),
                                          "primaryAbi" to Build.SUPPORTED_ABIS.firstOrNull()
                                              .orEmpty()
                                      )
                                  )
                              }

                              "prepareRuntimeStorage" -> {
                                  result.success(prepareRuntimeStorage())
                              }

                              "getRuntimePaths" -> {
                                  val directories = runtimeDirectories()
                                  result.success(
                                      directories.mapValues {
                                          it.value.absolutePath
                                      }
                                  )
                              }

                              else -> result.notImplemented()
                          }
                      } catch (error: Exception) {
                          result.error(
                              "RUNTIME_ERROR",
                              error.message ?: "Runtime operation failed",
                              null
                          )
                      }
                  }
              }
          }
          KOTLIN

      - name: Resolve dependencies
        working-directory: build_project
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: build_project
        run: flutter analyze

      - name: Build release APK
        working-directory: build_project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smapy-android-apk
          path: build_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
