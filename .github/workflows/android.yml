name: SMAPY Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: smapy-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Analyze and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=smapy \
            --org=com.smapy \
            build_project

          cp pubspec.yaml build_project/pubspec.yaml
          rm -rf build_project/lib
          cp -R lib build_project/lib
          rm -rf build_project/test

          mkdir -p \
            build_project/android/app/src/main/kotlin/com/smapy/smapy

          cp android_src/MainActivity.kt \
            build_project/android/app/src/main/kotlin/com/smapy/smapy/MainActivity.kt

      - name: Resolve dependencies
        working-directory: build_project
        run: flutter pub get

      - name: Format Dart source
        working-directory: build_project
        run: dart format lib

      - name: Analyze Dart source
        working-directory: build_project
        run: flutter analyze

      - name: Build release APK
        working-directory: build_project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smapy-release-apk
          path: build_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
